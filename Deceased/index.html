<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deceased Module | Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0f4c81; /* Classic Blue */
            --primary-light: #e6f0fa;
            --surface: #ffffff;
            --bg: #f0f4f8;
            --text-main: #2d3748;
            --text-muted: #718096;
            --border: #e2e8f0;
            --focus: #4299e1;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
        }

        .layout-container {
            display: flex;
            width: 100%;
        }

        .branding-side {
            flex: 1;
            background: linear-gradient(135deg, var(--primary), #2a69ac);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 4rem;
            position: relative;
            overflow: hidden;
        }

        .branding-side::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 60%);
            animation: pulse 15s infinite linear;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .branding-side h1 {
            font-size: 3rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            position: relative;
            z-index: 1;
        }

        .branding-side p {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.8);
            max-width: 400px;
            line-height: 1.6;
            position: relative;
            z-index: 1;
        }

        .login-side {
            width: 100%;
            max-width: 500px;
            background: var(--surface);
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 4rem;
            box-shadow: -10px 0 30px rgba(0,0,0,0.05);
            position: relative;
            z-index: 2;
        }

        .login-header {
            margin-bottom: 2.5rem;
        }

        .icon-box {
            width: 48px;
            height: 48px;
            background: var(--primary-light);
            color: var(--primary);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.5rem;
        }

        .login-header h2 {
            font-size: 1.75rem;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 0.5rem;
        }

        .login-header p {
            color: var(--text-muted);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: var(--text-main);
        }

        input {
            width: 100%;
            padding: 0.875rem 1rem;
            border: 1.5px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.2s;
            background: #f8fafc;
        }

        input:focus {
            outline: none;
            border-color: var(--focus);
            background: white;
            box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.15);
        }

        .forgot-password {
            display: block;
            text-align: right;
            font-size: 0.85rem;
            color: var(--focus);
            text-decoration: none;
            margin-top: 0.5rem;
            font-weight: 500;
        }

        .btn-submit {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 1rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 1rem;
        }

        .btn-submit:hover {
            background: #0b3b66;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 3rem;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--primary);
        }

        @media (max-width: 900px) {
            .branding-side {
                display: none;
            }
            .login-side {
                max-width: 100%;
                align-items: center;
            }
            form, .login-header {
                width: 100%;
                max-width: 400px;
            }
        }
    </style>
</head>
<body>

    <div class="layout-container">
        <div class="branding-side">
            <h1>Deceased Account Management</h1>
            <p>Empathetic, secure, and streamlined resolution for deceased customer accounts and beneficiary settlements.</p>
        </div>

        <div class="login-side">
            <div class="login-header">
                <div class="icon-box">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
                        <circle cx="9" cy="7" r="4"></circle>
                        <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
                        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                    </svg>
                </div>
                <h2>Staff Login</h2>
                <p>Please enter your credentials to proceed.</p>
            </div>

            <form action="#" method="POST">
                <div class="form-group">
                    <label>Corporate Email</label>
                    <input type="email" placeholder="name@bank.com" required>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" placeholder="••••••••" required>
                    <a href="#" class="forgot-password">Forgot Password?</a>
                </div>

                <button type="submit" class="btn-submit">Sign In</button>
            </form>

            <a href="../index.html" class="back-link">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                Back to Operation HUB
            </a>

            <div style="text-align: center; margin-top: 2.5rem; font-size: 0.8rem; color: var(--text-muted);">
                &copy; 2026 <a href="https://nextgeninnovations.com.np" target="_blank" style="color: var(--primary); text-decoration: none; font-weight: 600;">Next Gen Innovations Private Limited</a>. All rights reserved.
            </div>
        </div>
    </div>

</body>
</html>
